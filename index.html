<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/favicon2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchorglyph</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* buttons and text fields ignore the letter spacing around them
         unless they are told to take it */
      button,
      input,
      select,
      textarea {
        letter-spacing: inherit;
      }
      /* Anything hidden stays hidden, even where a rule below gives it a
         display of its own (buttons, labels, the title bar). */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--page-color);
        /* anything without a font of its own */
        font-family: 'Space Grotesk', sans-serif;
        /* every text gets a little more room between its letters; only
           the headlines keep their own, tighter spacing */
        letter-spacing: var(--text-tracking);
      }
      canvas {
        display: block;
      }

      /* Every text on the page is Space Grotesk, straight from the fonts
         folder: Regular for text and labels, Medium for the section
         headlines, the folder titles, the Iteration title and the mode
         names, Bold for the other headlines. */
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/SpaceGrotesk-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/SpaceGrotesk-Medium.ttf') format('truetype');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/SpaceGrotesk-Bold.ttf') format('truetype');
        font-weight: 700;
      }

      /* THE COLORS AND FONTS of the page around the drawing: a light paper
         look with thin grey lines, light grey buttons and black for what
         matters most. The drawing's own colors are in src/config.js and
         the Colors folder; the accent color is set from there too. */
      :root {
        /* the panels and the title bar */
        --page-color: rgb(246 246 244);
        /* the cards in the library */
        --card-color: rgb(255 255 255);
        /* the thin lines between sections, and around cards and frames */
        --line-color: rgb(226 226 222);
        /* text and the black buttons */
        --ink-color: rgb(24 24 24);
        /* the names in front of the controls, and the icons */
        --label-color: rgb(72 72 70);
        /* quiet text: hints and the small labels */
        --muted-color: rgb(138 138 134);
        /* the grey buttons, lighter to darker: resting, under the mouse,
           pressed or chosen */
        --button-color: rgb(234 234 231);
        --button-hover-color: rgb(224 224 220);
        --button-pressed-color: rgb(212 212 208);
        /* the black buttons: Save Iteration and the chosen mode */
        --primary-color: rgb(40 40 40);
        --primary-hover-color: rgb(56 56 54);
        --primary-text-color: rgb(250 250 248);
        /* the track of the Playback bar */
        --track-color: rgb(212 212 208);
        /* until the sketch sets it from src/config.js */
        --accent-color: rgb(20 196 40);
        /* the mode names on the start screen; the sketch sets it from
           foregroundColor in src/config.js */
        --foreground-color: rgb(34 34 34);
        /* the Load button on the pictures, and the veil behind the large
           preview: see-through versions of the card and the page */
        --load-button-color: rgb(255 255 255 / 0.92);
        --backdrop-color: rgb(236 236 232 / 0.72);

        --heading-font: 'Space Grotesk', sans-serif;
        /* the section headlines (Library, Modes, Controls, Playback), the
           folder titles, the Iteration title in the title bar and the
           mode names on the start screen */
        --title-font: 'Space Grotesk', sans-serif;
        --text-font: 'Space Grotesk', sans-serif;
        /* the small labels in capitals, like on a technical drawing. The
           same font as the text for now; set another one here to change
           only the labels. */
        --label-font: var(--text-font);
      }

      /* THE SIZES. The library (left) and the control panel (right) share
         the room the grid leaves in the window, minus a gap on each side of
         the grid, so they grow and shrink with the window. They never get
         narrower than the smallest width or wider than the largest.
         --grid-size is set by src/sketch.js from gridSize in src/config.js. */
      :root {
        --panel-gap: 24px;
        --panel-min-width: 260px;
        --panel-max-width: 400px;
        --panel-width: clamp(
          var(--panel-min-width),
          calc((100vw - var(--grid-size, 800px)) / 2 - var(--panel-gap)),
          var(--panel-max-width)
        );
        /* the room between the panels' edges and what is in them */
        --panel-padding: 28px;
        /* the room the folder arrows take in front of their titles,
           including the space between arrow and text */
        --arrow-width: 24px;
        /* how tall the title bar across the top of the window is. Both
           panels start below it. */
        --top-bar-height: 48px;
        /* how tall the headlines are: Library, Modes, Controls, Playback,
           and how far the first one in each panel sits below the title bar */
        --section-title-height: 48px;
        --headline-top-gap: 12px;
        /* the grey buttons, the larger ones in the library and Playback,
           and how round their corners are */
        --button-height: 36px;
        --large-button-height: 44px;
        --radius: 6px;
        --large-radius: 8px;
        --card-radius: 14px;
        /* the size of the small labels in capitals */
        --label-size: 10.5px;
        --label-tracking: 0.14em;
        /* the size and spacing of the headlines: Library, Modes, Controls,
           Playback, and Iteration in the title bar */
        --headline-size: 20px;
        --headline-tracking: 0.1px;
        /* added to the letter spacing of every text except the headlines */
        --text-tracking: 0.3px;
        /* the quiet ring around a button reached with the Tab key, instead
           of the browser's blue one */
        --focus-ring: 2px solid var(--button-pressed-color);
      }
      /* INVERTED COLORS, while the Invert switch is on: every color above
         turned around (each channel is 255 minus the one above), so light
         becomes dark. The accent keeps its color. src/sketch.js inverts
         the drawing's Main and Background at the same time. */
      body.is-inverted {
        --page-color: rgb(9 9 11);
        --card-color: rgb(0 0 0);
        --line-color: rgb(29 29 33);
        --ink-color: rgb(231 231 231);
        --label-color: rgb(183 183 185);
        --muted-color: rgb(117 117 121);
        --button-color: rgb(21 21 24);
        --button-hover-color: rgb(31 31 35);
        --button-pressed-color: rgb(43 43 47);
        --primary-color: rgb(231 231 231);
        --primary-hover-color: rgb(199 199 201);
        --primary-text-color: rgb(5 5 7);
        --track-color: rgb(43 43 47);
        --load-button-color: rgb(0 0 0 / 0.92);
        --backdrop-color: rgb(19 19 23 / 0.72);
        /* the mode names: foregroundColor turned around, set by the sketch */
        --foreground-color: var(--inverted-foreground-color);
      }

      /* THE BUTTONS outside of lil-gui's own rows, in both panels and the
         preview: light grey, with rounded corners, an icon (if it has one)
         in front of its word. makeButton() and makeIconButton() in
         src/lib/gui.js give them the class ui-button. */
      .ui-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: var(--button-height);
        padding: 0 12px;
        border: none;
        border-radius: var(--radius);
        background: var(--button-color);
        color: var(--ink-color);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .ui-button:hover {
        background: var(--button-hover-color);
      }
      .ui-button:active {
        background: var(--button-pressed-color);
      }
      .ui-button:focus-visible {
        outline: var(--focus-ring);
        outline-offset: 1px;
      }
      /* the buttons for selected variations, while none is selected */
      .ui-button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .ui-button:disabled:hover {
        background: var(--button-color);
      }
      /* icons keep their size when the button gets narrow */
      button svg {
        flex-shrink: 0;
      }

      /* THE SMALL LABELS in capitals, like on a technical drawing: in the
         title bar, around the grid, on the start screen, at the bottom of
         the library and in the large preview */
      .top-bar-brand,
      .top-bar-subtitle,
      .start-mode-label,
      .stage-label,
      .project-footer,
      .library-preview-labels {
        font-family: var(--label-font);
        font-size: var(--label-size);
        letter-spacing: calc(var(--label-tracking) + var(--text-tracking));
        text-transform: uppercase;
      }
      /* THE PROJECT'S MARK AND NAME at the bottom left, the same on the
         start screen and at the bottom of the library: the dots, and next
         to them the name with the subtitle below it. Made by
         createProjectFooter() in src/lib/gui.js. Both sit
         --footer-bottom-gap above the window's bottom edge. The library's
         is the panel's padding in from the left edge, the start screen's
         is --start-margin in, in line with the headline. */
      :root {
        --footer-bottom-gap: 24px;
      }
      .project-footer {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--ink-color);
      }
      .project-footer svg {
        flex-shrink: 0;
        color: var(--label-color);
      }
      .project-footer-text {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .project-subtitle {
        color: var(--muted-color);
      }

      /* THE TITLE BAR across the top: the project's name on the left, the
         title of the middle in the middle, the subtitle on the
         right, and at each end the button that folds the panel below it
         away. Its texts are in src/config.js. */
      .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1001;
        height: var(--top-bar-height);
        display: grid;
        /* the outer two take the same room, so the middle stays centred */
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 var(--panel-padding);
        background: var(--page-color);
        border-bottom: 1px solid var(--line-color);
        color: var(--ink-color);
      }
      /* the two ends: each keeps its own column, also when the title in
         the middle is left out on a phone */
      .top-bar-start,
      .top-bar-end {
        display: flex;
        align-items: center;
        gap: var(--panel-button-gap);
      }
      .top-bar-start {
        grid-column: 1;
        justify-self: start;
      }
      .top-bar-end {
        grid-column: 3;
        justify-self: end;
      }
      /* the buttons that fold the library and the control panel away: only
         an icon, grey until the mouse is over it. They stick out by
         --panel-button-inset on the outside, so the icon itself lines up
         with the text in the panel below. --panel-button-gap is the room
         between a button and the name or the subtitle next to it. */
      .top-bar {
        --panel-button-size: 32px;
        --panel-button-inset: 8px;
        --panel-button-gap: 14px;
      }
      .ui-button.top-bar-panel-button {
        width: var(--panel-button-size);
        height: var(--panel-button-size);
        padding: 0;
        background: none;
        color: var(--label-color);
      }
      .top-bar-start .top-bar-panel-button {
        margin-left: calc(-1 * var(--panel-button-inset));
      }
      .top-bar-end .top-bar-panel-button {
        margin-right: calc(-1 * var(--panel-button-inset));
      }
      /* On the start screen the buttons are hidden, and the name and the
         subtitle sit --start-margin in from the window's edges, in line
         with the headline. Once a mode is picked they move in to make room
         while the start screen fades out, and the buttons fade in after,
         into the room that is free. On the way back the buttons fade out
         first, then the name and the subtitle move out. They move with the
         start screen, so they take its delay.
         --start-shift is how far they move: from where they are with the
         buttons (the padding plus the button's room) to the start margin. */
      .top-bar-start .top-bar-brand,
      .top-bar-end .top-bar-subtitle {
        --panel-button-room: calc(var(--panel-button-size) - var(--panel-button-inset) + var(--panel-button-gap));
        --start-shift: calc(var(--panel-padding) + var(--panel-button-room) - var(--start-margin));
        transition: transform var(--fade-duration) ease-in-out var(--start-screen-delay);
      }
      body.is-starting .top-bar-start .top-bar-brand {
        transform: translateX(calc(-1 * var(--start-shift)));
      }
      body.is-starting .top-bar-end .top-bar-subtitle {
        transform: translateX(var(--start-shift));
      }
      /* while its panel is open, the button sits on light grey, like a
         switched-on button */
      .ui-button.top-bar-panel-button[aria-expanded='true'] {
        background: var(--button-color);
        color: var(--ink-color);
      }
      .ui-button.top-bar-panel-button:hover {
        background: var(--button-hover-color);
        color: var(--ink-color);
      }
      /* the name: a button back to the start screen */
      .top-bar-brand {
        display: flex;
        align-items: center;
        padding: 6px 0;
        border: none;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      .top-bar-brand:hover {
        opacity: 0.6;
      }
      .top-bar-brand:focus-visible {
        outline: var(--focus-ring);
        outline-offset: 4px;
        border-radius: var(--radius);
      }
      /* the same size as the Library and Modes headlines */
      .top-bar-title {
        grid-column: 2;
        font-family: var(--title-font);
        font-size: var(--headline-size);
        font-weight: 500;
        letter-spacing: calc(var(--headline-tracking) + var(--text-tracking));
      }
      .top-bar-subtitle {
        color: var(--muted-color);
      }

      /* THE START SCREEN, see src/lib/start.js: the question on the left,
         over the drawing, and the mode cards on the right. It lies below
         the title bar. While it is open (is-starting), the panels, the
         labels around the grid and the title in the middle of the title
         bar wait, invisible. Once a mode is picked, the start screen fades
         out in the first half of the change, and they fade in in the
         second half, so the two never lie on top of each other. Going
         back to the start screen, it is the other way round: they fade
         out first, then the start screen fades in. Each fade takes half of
         the change; whatever appears second waits for the first half.
         src/lib/start.js sets --start-transition-duration. */
      body {
        --fade-duration: calc(var(--start-transition-duration) / 2);
        /* on the way to the main screen: the start screen goes first */
        --start-screen-delay: 0s;
        --main-screen-delay: var(--fade-duration);
      }
      body.is-starting {
        /* on the way to the start screen: the main screen goes first */
        --start-screen-delay: var(--fade-duration);
        --main-screen-delay: 0s;
      }
      .library,
      .lil-gui.lil-root,
      .stage-frame,
      .top-bar-title,
      .top-bar-panel-button,
      .dock {
        transition: opacity var(--fade-duration) ease var(--main-screen-delay);
      }
      body.is-starting .library,
      body.is-starting .lil-gui.lil-root,
      body.is-starting .stage-frame,
      body.is-starting .top-bar-title,
      body.is-starting .top-bar-panel-button,
      body.is-starting .dock {
        opacity: 0;
        pointer-events: none;
      }
      /* The two panels also slide in from the window's edges while they
         fade in, and back out while they fade out: the library from the
         left, the control panel from the right. This uses `translate`, not
         `transform`, since the panels' transform already folds them away;
         the two add up. How fast and smooth the slide is, is set with the
         panels' other transitions, under "folded panels". */
      body.is-starting .library {
        translate: -100% 0;
      }
      body.is-starting .lil-gui.lil-root {
        translate: 100% 0;
      }
      .start-screen {
        /* how wide the column of cards is: as wide as the control panel,
           so it sits exactly where the panel slides in once a mode is
           picked */
        --start-modes-width: var(--panel-width);
        /* how far below the title bar the tops of the switches on the
           right start (where the control panel's Invert switch is), and
           the tops of the headline's capitals on the left */
        --start-switch-top: 24px;
        --start-headline-top: 40px;
        /* the room above the switches inside the card column */
        --start-modes-padding-top: 16px;
        position: fixed;
        top: var(--top-bar-height);
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1002;
        display: flex;
        color: var(--ink-color);
        transition: opacity var(--fade-duration) ease var(--start-screen-delay);
      }
      body:not(.is-starting) .start-screen {
        opacity: 0;
        pointer-events: none;
      }
      /* the left part is see-through, so the drawing shows, and lets
         clicks through to the canvas */
      .start-stage {
        position: relative;
        flex: 1;
        pointer-events: none;
      }
      /* how far the headline, the name and subtitle in the title bar, the
         project's mark at the bottom and the mode cards sit in from the
         window's edges on the start screen: the same as the panels'
         padding, so the start screen and the main screen line up */
      :root {
        --start-margin: var(--panel-padding);
      }
      /* The tops of the headline's capitals start --start-headline-top
         below the title bar. A line of text has empty room above its
         capitals, more the larger the text; text-box cuts it away, so the
         headline starts exactly at their top, whatever its size. (Browsers
         without text-box, like older Firefox, keep the room, and the
         headline sits a little lower.) */
      .start-headline {
        position: absolute;
        top: var(--start-headline-top);
        left: var(--start-margin);
        text-box: trim-both cap alphabetic;
        font-family: var(--heading-font);
        font-size: clamp(44px, 5vw, 84px);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.01em;
        /* the \n in the text starts a new line */
        white-space: pre-line;
      }
      .start-footer {
        position: absolute;
        left: var(--start-margin);
        bottom: var(--footer-bottom-gap);
      }
      /* the right part: the cards at the bottom, below each other */
      .start-modes {
        width: var(--start-modes-width);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 14px;
        padding: var(--start-modes-padding-top) var(--start-margin) 56px;
        background: var(--page-color);
        border-left: 1px solid var(--line-color);
        /* the slide out and back in: the same as the control panel's (see
           "folded panels"), at the start screen's moment */
        transition: translate var(--panel-slide-duration) var(--fold-easing) var(--start-screen-delay);
      }
      /* Invert and Anchors at the top of the card column, on the right,
         below each other, with their switches lined up on the right. The
         panel keeps room for its scrollbar on the right
         (--switch-scrollbar-room, as wide as lil-gui's --scrollbar-width),
         so these keep the same room. The cards sit at the bottom.
         --switch-padding is the room a switch keeps above its track (see
         "the switches"); the margin brings the track's top to
         --start-switch-top. */
      .start-switches {
        --switch-scrollbar-room: 6px;
        --switch-padding: 4px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        margin: calc(var(--start-switch-top) - var(--start-modes-padding-top) - var(--switch-padding)) var(--switch-scrollbar-room) auto;
      }
      /* Picking a mode slides the cards out to the right, the whole column's
         width, while the control panel slides in to the same place, the
         same way. Going back to the start screen slides them in again. */
      body:not(.is-starting) .start-modes {
        translate: 100% 0;
      }
      .start-mode {
        /* the arrow's size, and the room kept between it and the name */
        --mode-arrow-size: 28px;
        --mode-name-gap: 12px;
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        row-gap: 10px;
        column-gap: var(--mode-name-gap);
        padding: 30px 24px 28px;
        /* lets the name measure the card's width (cqi, see .start-mode-name) */
        container-type: inline-size;
        border: 1px solid var(--line-color);
        border-radius: var(--card-radius);
        background: var(--page-color);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 200ms, border-color 200ms;
      }
      .start-mode:focus-visible {
        outline: var(--focus-ring);
        outline-offset: 2px;
      }
      /* the card of the mode on show: tinted in the accent color */
      .start-mode.is-active {
        background: color-mix(in srgb, var(--accent-color) 10%, var(--card-color));
        border-color: var(--accent-color);
      }
      .start-mode-label {
        grid-column: 1 / -1;
        color: var(--muted-color);
      }
      /* The mode's name: it grows with the window, but never past the room
         the card has for it, next to the arrow. 100cqi is the card's width
         inside its padding; "Animation", the longest name, is about
         --longest-name-width times as wide as its font size. */
      .start-mode-name {
        --longest-name-width: 5;
        color: var(--foreground-color);
        font-family: var(--title-font);
        font-size: min(
          clamp(28px, 2.6vw, 40px),
          calc((100cqi - var(--mode-arrow-size) - var(--mode-name-gap)) / var(--longest-name-width))
        );
        font-weight: 500;
        letter-spacing: calc(-0.01em + var(--text-tracking));
      }
      .start-mode-arrow {
        display: flex;
        transition: transform 200ms;
      }
      .start-mode-arrow svg {
        width: var(--mode-arrow-size);
        height: var(--mode-arrow-size);
      }
      .start-mode:hover .start-mode-arrow,
      .start-mode.is-active .start-mode-arrow {
        transform: translateX(4px);
      }

      /* THE LABELS AROUND THE GRID: small capitals above and below its
         corners, and a + beyond each corner, like on a drawing board.
         src/sketch.js moves them to where the grid is. */
      /* exactly as big as the grid on screen; src/sketch.js sets
         --shown-grid-size (smaller than --grid-size when the window is too
         small for the grid) */
      .stage-frame {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--shown-grid-size, var(--grid-size));
        height: var(--shown-grid-size, var(--grid-size));
        /* above the drawing, below the save flash and the panels */
        z-index: 999;
        /* clicks go through to the canvas below */
        pointer-events: none;
      }
      .stage-label {
        position: absolute;
        white-space: nowrap;
        color: var(--muted-color);
      }
      .stage-label.is-top-left,
      .stage-label.is-top-right {
        bottom: calc(100% + 12px);
      }
      .stage-label.is-bottom-left,
      .stage-label.is-bottom-right {
        top: calc(100% + 12px);
      }
      .stage-label.is-top-left,
      .stage-label.is-bottom-left {
        left: 0;
      }
      .stage-label.is-top-right,
      .stage-label.is-bottom-right {
        right: 0;
      }
      /* the + marks: two thin lines crossing, this far out from each
         corner, sideways and up or down */
      .stage-mark {
        --mark-size: 13px;
        --mark-distance-x: 36px;
        --mark-distance-y: 10px;
        position: absolute;
        width: var(--mark-size);
        height: var(--mark-size);
      }
      .stage-mark::before,
      .stage-mark::after {
        content: '';
        position: absolute;
        background: var(--muted-color);
      }
      .stage-mark::before {
        left: calc(var(--mark-size) / 2);
        width: 1px;
        height: 100%;
      }
      .stage-mark::after {
        top: calc(var(--mark-size) / 2);
        width: 100%;
        height: 1px;
      }
      .stage-mark.is-top-left,
      .stage-mark.is-top-right {
        top: calc(-1 * var(--mark-distance-y) - var(--mark-size) / 2);
      }
      .stage-mark.is-bottom-left,
      .stage-mark.is-bottom-right {
        bottom: calc(-1 * var(--mark-distance-y) - var(--mark-size) / 2);
      }
      .stage-mark.is-top-left,
      .stage-mark.is-bottom-left {
        left: calc(-1 * var(--mark-distance-x) - var(--mark-size) / 2);
      }
      .stage-mark.is-top-right,
      .stage-mark.is-bottom-right {
        right: calc(-1 * var(--mark-distance-x) - var(--mark-size) / 2);
      }

      /* THE SECTION HEADLINES: Library, Modes, Controls and Playback. All
         get the same box, so their text sits at the same height. */
      .library-title,
      .panel-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: var(--section-title-height);
        padding: 0 var(--panel-padding);
        background: none;
        color: var(--ink-color);
        font-family: var(--title-font);
        font-size: var(--headline-size);
        font-weight: 500;
        letter-spacing: var(--headline-tracking);
      }
      /* the first headline of each panel sits a little below the title bar */
      .library-title,
      .panel-section-title.is-first {
        margin-top: var(--headline-top-gap);
      }
      /* Controls and Playback start a new section, below a line */
      .panel-section-title:not(.is-first) {
        border-top: 1px solid var(--line-color);
      }
      /* the dots on the right of the Controls headline: no background
         until the mouse is over them */
      .panel-section-title .panel-more-button {
        width: 32px;
        height: 32px;
        padding: 0;
        background: none;
        color: var(--label-color);
      }

      /* THE SWITCHES: a name and a small on/off switch, like Invert in
         the panel and Anchors and Invert on the start screen. Made
         by createSwitchButton() in src/lib/gui.js. "button." makes these
         rules win over lil-gui's own rules for buttons. */
      button.switch-button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: auto;
        padding: 4px 0;
        border: none;
        background: none;
        color: var(--label-color);
        font-family: var(--text-font);
        font-size: 14px;
        cursor: pointer;
      }
      button.switch-button:hover {
        color: var(--ink-color);
      }
      button.switch-button:focus-visible {
        outline: var(--focus-ring);
        outline-offset: 2px;
        border-radius: var(--radius);
      }
      /* the switch: a rounded track with a round knob, on the left while
         off, on the right and on a dark track while on */
      .switch-track {
        --track-width: 36px;
        --track-height: 20px;
        --knob-inset: 2px;
        --knob-size: calc(var(--track-height) - 2 * var(--knob-inset));
        position: relative;
        width: var(--track-width);
        height: var(--track-height);
        border-radius: calc(var(--track-height) / 2);
        background: var(--button-pressed-color);
        transition: background 200ms;
      }
      .switch-track::after {
        content: '';
        position: absolute;
        top: var(--knob-inset);
        left: var(--knob-inset);
        width: var(--knob-size);
        height: var(--knob-size);
        border-radius: 50%;
        background: var(--card-color);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
        transition: transform 200ms;
      }
      .switch-button[aria-checked='true'] .switch-track {
        background: var(--ink-color);
      }
      .switch-button[aria-checked='true'] .switch-track::after {
        transform: translateX(calc(var(--track-width) - var(--track-height)));
      }

      /* THE CONTROL PANEL on the right, the whole height below the title
         bar. lil-gui reads its colors and sizes from these variables, and
         every folder sets its own, so they apply to all of them. */
      .lil-gui {
        --background-color: var(--page-color);
        --text-color: var(--ink-color);
        --title-background-color: var(--page-color);
        --title-text-color: var(--ink-color);
        --widget-color: var(--button-color);
        --hover-color: var(--button-hover-color);
        --focus-color: var(--button-pressed-color);
        /* the slider knobs and the typed text */
        --number-color: var(--ink-color);
        --string-color: var(--ink-color);
        --font-family: var(--text-font);
        --font-size: 14px;
        --input-font-size: 14px;
        /* how tall each row is, and the room between two rows */
        --widget-height: 28px;
        --spacing: 6px;
        --padding: var(--panel-padding);
        /* how much of a row the name in front takes */
        --name-width: 38%;
        --widget-border-radius: var(--radius);
        --slider-knob-width: 2px;
        /* how tall the folder titles are */
        --title-height: 44px;
        --scrollbar-width: 6px;
      }
      .lil-gui.lil-root.lil-auto-place {
        top: var(--top-bar-height);
        right: 0;
        height: calc(100% - var(--top-bar-height));
        max-height: none;
        border-left: 1px solid var(--line-color);
        /* lil-gui reads its width from --width */
        --width: var(--panel-width);
      }
      /* lil-gui's own title would fold the whole panel away, so it is
         hidden. The panel's headlines, starting with Modes, are made in
         src/sketch.js. */
      .lil-gui.lil-root > .lil-title {
        display: none;
      }

      /* The part of each panel that scrolls when it gets long: the folders
         in the control panel, the cards in the library. A scrollbar takes
         room from what is inside, which made the padding seem to change as
         soon as one appeared. "stable" keeps that room free on the right
         all the time, scrollbar or not. */
      .lil-gui.lil-root > .lil-children,
      .library-list {
        scrollbar-gutter: stable;
      }

      /* The Modes folder always stays open and has no title of its own:
         the panel's headline above it already says Modes. Its controls
         line up with the headline. */
      .lil-gui.lil-root > .lil-children > .lil-gui.lil-always-open > .lil-title {
        display: none;
      }
      .lil-gui.lil-root > .lil-children > .lil-gui.lil-always-open {
        border-top: none;
        padding-bottom: 18px;
      }

      /* every other folder: a line on top, and its title with an arrow in
         front. The title's text starts where the controls below start. */
      .lil-gui.lil-root > .lil-children > .lil-gui {
        border-top: 1px solid var(--line-color);
      }
      .lil-gui.lil-root > .lil-children > .lil-gui > .lil-title {
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 var(--panel-padding);
        border: none;
        font-family: var(--title-font);
        font-size: 16px;
        font-weight: 500;
      }
      /* the arrow: the corner of a small square, turned to point down while
         the folder is open and right while it is closed. It takes
         --arrow-width in all, so the title's text starts right after. */
      .lil-gui.lil-root > .lil-children > .lil-gui > .lil-title::before {
        --arrow-size: 7px;
        --arrow-left: 2px;
        content: '';
        flex-shrink: 0;
        width: var(--arrow-size);
        height: var(--arrow-size);
        padding: 0;
        margin: 0 calc(var(--arrow-width) - var(--arrow-size) - var(--arrow-left)) 0 var(--arrow-left);
        border: solid currentColor;
        border-width: 0 1.5px 1.5px 0;
        transform: translateY(-2px) rotate(45deg);
        transition: transform 200ms;
      }
      .lil-gui.lil-root > .lil-children > .lil-gui.lil-closed > .lil-title::before {
        transform: rotate(-45deg);
      }
      /* A closed folder lights up as a whole when the mouse is over it.
         A click anywhere in it opens it (see src/sketch.js). The title
         doesn't light up on its own then, so the whole section is one
         even color. */
      .lil-gui.lil-root > .lil-children > .lil-gui.lil-closed:hover {
        background: var(--button-color);
        cursor: pointer;
      }
      .lil-gui.lil-root > .lil-children > .lil-gui > .lil-title:hover {
        background: none;
        opacity: 1;
      }
      /* room below the last control of an open folder. A margin, not a
         padding, so it folds away smoothly with the folder. It goes to the
         last control that shows: a hidden control (lil-gui hides it with
         style="display: none", like Main 2 while Gradient is Off) can't
         hold it, so the one above it gets it. Read: a control that isn't
         hidden, with no control after it that isn't hidden. */
      .lil-gui.lil-root > .lil-children > .lil-gui:not(.lil-always-open) > .lil-children
        > :not([style*='display: none']):not(:has(~ :not([style*='display: none']))) {
        margin-bottom: 16px;
      }

      /* the folder icons: the eye and the Randomize arrows on the right of
         a folder's title */
      .lil-title-icons {
        position: absolute;
        right: var(--panel-padding);
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 12px;
        color: var(--label-color);
      }
      .lil-title-icon {
        display: flex;
        cursor: pointer;
      }
      .lil-title-icon:hover {
        color: var(--ink-color);
      }

      /* THE SUBHEADINGS inside a folder, like Gradient in Colors (made by
         addSubheading() in src/lib/gui.js): some room above, then the
         name, as large as a folder title, with its arrows on the right. It
         lines up with the rows below it. */
      .lil-gui .lil-subheading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 10px var(--panel-padding) 4px calc(var(--panel-padding) + var(--arrow-width));
        padding-top: 14px;
        color: var(--ink-color);
        font-family: var(--title-font);
        font-size: 16px;
        font-weight: 500;
      }
      .lil-subheading .lil-title-icon {
        color: var(--label-color);
      }
      .lil-subheading .lil-title-icon:hover {
        color: var(--ink-color);
      }

      /* the rows inside the folders start where the folder titles' text
         starts; the rows of Modes start at the headline */
      .lil-gui .lil-controller {
        padding: 0 var(--panel-padding) 0 calc(var(--panel-padding) + var(--arrow-width));
      }
      .lil-gui.lil-always-open .lil-controller {
        padding-left: var(--panel-padding);
      }
      .lil-gui .lil-controller > .lil-name {
        color: var(--label-color);
      }
      /* the sliders: a light track, a little lower than the row, with a
         thin black line for a knob */
      .lil-gui .lil-controller.lil-number .lil-slider {
        height: 22px;
      }
      .lil-gui input[type='text'] {
        padding: 0 10px;
      }
      /* the color fields get a thin edge, so a light color still shows
         where it ends */
      .lil-gui .lil-controller.lil-color .lil-display {
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08);
      }

      /* the buttons in the folders (Iterate, Clear, the switches, the
         Style field). Side by side, each takes the room its text needs, so
         a long word like "Animation" isn't cut off. */
      .lil-gui .lil-controller button {
        height: var(--button-height);
        padding: 0 12px;
        width: auto;
        flex: 1 1 auto;
      }

      /* the switches: Glyph | Shape | Animation and the others. The chosen
         part is black; in the smaller, secondary switches only a darker
         grey, so the main switch stands out. */
      .lil-gui .lil-switch .lil-widget {
        gap: 4px;
      }
      .lil-gui .lil-switch button {
        height: 38px;
      }
      .lil-gui .lil-switch button.is-chosen {
        background: var(--primary-color);
        color: var(--primary-text-color);
      }
      .lil-gui .lil-switch.is-secondary button {
        height: 32px;
      }
      .lil-gui .lil-switch.is-secondary button.is-chosen {
        background: var(--button-pressed-color);
        color: var(--ink-color);
      }

      /* Randomize All and Clear, side by side below Controls */
      .panel-section-actions {
        display: flex;
        gap: 6px;
        padding: 0 var(--panel-padding) 18px;
      }
      .panel-section-actions .ui-button {
        flex: 1;
      }

      /* Playback: Restart, Play/Pause and Stop as squares, then the bar */
      .panel-playback {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 var(--panel-padding) 24px;
      }
      .panel-playback .ui-button {
        width: var(--large-button-height);
        height: var(--large-button-height);
        padding: 0;
        border-radius: var(--large-radius);
      }
      /* The bar is as tall as a finger needs to grab it; the thin line
         is drawn in its middle. */
      .panel-progress {
        position: relative;
        flex: 1;
        height: 24px;
        margin: 0 8px 0 16px;
        cursor: pointer;
        /* a drag on it moves the dot, not the panel's scroll */
        touch-action: none;
      }
      .panel-progress::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 2px;
        border-radius: 1px;
        background: var(--track-color);
        transform: translateY(-50%);
      }
      .panel-progress-dot {
        position: absolute;
        top: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ink-color);
        transform: translate(-50%, -50%);
      }
      /* outside Animation mode there is no loop to show */
      .panel-progress.is-idle {
        opacity: 0.4;
        cursor: default;
        pointer-events: none;
      }

      /* THE LIBRARY on the left */
      .library {
        position: fixed;
        top: var(--top-bar-height);
        left: 0;
        z-index: 1001;
        width: var(--panel-width);
        height: calc(100% - var(--top-bar-height));
        display: flex;
        flex-direction: column;
        background: var(--page-color);
        border-right: 1px solid var(--line-color);
        color: var(--ink-color);
        font-family: var(--text-font);
        font-size: 14px;
      }
      /* Save Iteration: the one black button, with its icon at the left
         and its word in the middle */
      .library-save {
        position: relative;
        height: 48px;
        margin: 8px var(--panel-padding) 10px;
        background: var(--primary-color);
        color: var(--primary-text-color);
      }
      .library-save:hover {
        background: var(--primary-hover-color);
      }
      .library-save svg {
        position: absolute;
        left: 18px;
      }
      .library-selection-actions {
        display: flex;
        gap: 8px;
        margin: 0 var(--panel-padding) 8px;
      }
      .library-selection-actions .ui-button {
        flex: 1;
        height: 40px;
      }
      .library-divider {
        border: none;
        border-top: 1px solid var(--line-color);
        margin: 16px var(--panel-padding) 20px;
      }
      /* The library is a column exactly as tall as the window. When its
         contents need more room (the long message below, on a short phone),
         the browser squeezes everything in the column to fit, the Save
         Iteration button too. These keep their size instead; the message
         and the list scroll. */
      .library-save,
      .library-selection-actions,
      .library-divider,
      .library-footer {
        flex-shrink: 0;
      }

      /* the message while nothing is saved: a dot, a line, and a quieter
         hint below it. If it doesn't fit, it scrolls. */
      .library-empty {
        /* the room above each intro paragraph and above the shortcuts, so
           they are all evenly spaced */
        --intro-gap: 24px;
        min-height: 0;
        overflow-y: auto;
        padding: 0 var(--panel-padding);
        line-height: 1.5;
      }
      .library-empty-title,
      .library-empty-hint {
        padding-left: 22px;
      }
      /* "Nothing saved yet." and each intro paragraph get a dot in front */
      .library-empty-title,
      .library-intro p {
        position: relative;
      }
      .library-empty-title::before,
      .library-intro p::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 0.55em;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink-color);
      }
      .library-empty-hint {
        margin-top: 10px;
        color: var(--muted-color);
      }
      /* below the hint: what the tool does, then the keyboard shortcuts.
         They line up with the text above, after its dot. */
      .library-intro,
      .library-shortcuts {
        margin-top: var(--intro-gap);
      }
      .library-intro p,
      .library-shortcuts {
        padding-left: 22px;
      }
      .library-intro p + p {
        margin-top: var(--intro-gap);
      }
      /* the shortcuts are as quiet as the hint */
      .library-shortcuts {
        list-style: none;
        color: var(--muted-color);
      }

      /* the saved variations: one card each, newest on top */
      .library-list:empty {
        display: none;
      }
      .library-list {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        padding: 0 var(--panel-padding) 16px;
      }
      /* a thin scrollbar, like the control panel's */
      .library-list::-webkit-scrollbar,
      .library-empty::-webkit-scrollbar {
        width: 6px;
      }
      .library-list::-webkit-scrollbar-thumb,
      .library-empty::-webkit-scrollbar-thumb {
        border-radius: 3px;
        background: var(--button-pressed-color);
      }
      .library-item {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 14px;
        padding: 12px;
        background: var(--card-color);
        border: 1px solid var(--line-color);
        border-radius: var(--card-radius);
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.04);
      }
      /* the variation loaded or saved last */
      .library-item.is-active {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 1px var(--accent-color);
      }
      /* the name, to click and type into, and Delete on its right */
      .library-item-header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .library-item-header input {
        flex: 1;
        min-width: 0;
        height: 32px;
        padding: 0 6px;
        border: none;
        border-radius: var(--radius);
        background: transparent;
        color: inherit;
        font-family: var(--heading-font);
        font-size: 18px;
        cursor: text;
      }
      .library-item-header input:focus {
        background: var(--button-color);
        outline: none;
      }
      .library-item-header .ui-button {
        width: 32px;
        height: 32px;
        padding: 0;
      }
      /* the picture, with the checkbox, the selection layer and Load on top */
      .library-thumbnail {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        background: var(--button-color);
      }
      .library-thumbnail img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        /* a slanted grid makes a wider picture; it is shown whole */
        object-fit: contain;
        cursor: zoom-in;
      }
      .library-selection-mask {
        position: absolute;
        inset: 0;
        background: var(--accent-color);
        opacity: 0;
        /* clicks go through to the picture below */
        pointer-events: none;
      }
      .library-item.is-selected .library-selection-mask {
        opacity: 0.25;
      }
      /* the checkbox: a small white square in a see-through frame, so it
         shows on light and dark drawings. Ticked, it fills with the accent. */
      .library-item .library-selection-checkbox {
        --checkbox-halo: 0 0 0 6px rgb(128 128 128 / 0.3);
        position: absolute;
        top: 14px;
        left: 14px;
        width: 18px;
        height: 18px;
        appearance: none;
        border-radius: 4px;
        background: var(--card-color);
        box-shadow: var(--checkbox-halo);
        cursor: pointer;
      }
      .library-item .library-selection-checkbox:checked {
        background: var(--accent-color);
        box-shadow: inset 0 0 0 3px var(--card-color), var(--checkbox-halo);
      }
      /* Load: a white square with an arrow on the picture's bottom right */
      .library-load {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: var(--large-radius);
        background: var(--load-button-color);
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
      }
      .library-load:hover {
        background: var(--card-color);
      }

      /* the project's mark, name and subtitle at the bottom of the library
         (see "the project's mark and name") */
      .library-footer {
        margin-top: auto;
        padding: 20px var(--panel-padding) var(--footer-bottom-gap);
      }

      /* FOLDED PANELS: the buttons at the ends of the title bar slide the
         library out to the left and the control panel out to the right
         (see src/lib/panels.js), and back in. The grid glides along into
         the middle of the room that is left. Once a panel is out of sight
         it also turns invisible, so the Tab key skips what is in it; when
         it comes back it is visible straight away, before it slides in. */
      :root {
        /* fast at first, then slowing down gently, like the library's cards */
        --fold-easing: cubic-bezier(0.22, 1, 0.36, 1);
        /* how long the panels take to slide in or out: when a mode is
           picked or the start screen comes back, and when the buttons fold
           them away or bring them back. The same slide everywhere. */
        --panel-slide-duration: 800ms;
      }
      /* Every transition of the two panels, in one list: a rule that sets
         `transition` replaces the whole list, so they can't be split up.
         The fade and the slide in from the edges (translate) follow the
         start screen; the fold (transform) follows the buttons. */
      .library,
      .lil-gui.lil-root {
        transition:
          opacity var(--fade-duration) ease var(--main-screen-delay),
          translate var(--panel-slide-duration) var(--fold-easing) var(--main-screen-delay),
          transform var(--panel-slide-duration) var(--fold-easing),
          visibility 0s;
      }
      body.is-library-folded .library {
        transform: translateX(-100%);
      }
      body.is-controls-folded .lil-gui.lil-root {
        transform: translateX(100%);
      }
      body.is-library-folded .library,
      body.is-controls-folded .lil-gui.lil-root {
        visibility: hidden;
        transition:
          opacity var(--fade-duration) ease var(--main-screen-delay),
          translate var(--panel-slide-duration) var(--fold-easing) var(--main-screen-delay),
          transform var(--panel-slide-duration) var(--fold-easing),
          visibility 0s linear var(--panel-slide-duration);
      }

      /* THE START SCREEN ON A NARROW WINDOW (a phone, or a tablet held
         upright): the headline at the top, the drawing in the middle,
         exactly where it will be on the main screen, and below it a panel
         with the switches and the modes in a carousel, in the dock's
         place (src/sketch.js sets --dock-top). Picking a mode slides the
         panel down out of the window, and the dock appears where it was. */
      body.is-narrow .start-screen {
        display: block;
        /* the room around the panel's contents */
        --start-sheet-padding: 16px;
      }
      body.is-narrow .start-stage {
        position: absolute;
        inset: 0;
      }
      body.is-narrow .start-headline {
        font-size: clamp(30px, 9vw, 44px);
      }
      /* the panel would cover the project's name at the bottom left */
      body.is-narrow .start-footer {
        display: none;
      }
      body.is-narrow .start-modes {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        /* from a padding above the dock's top edge down to the bottom of
           the window; if its contents need more room (a short phone), it
           grows upwards instead of being cut off */
        min-height: calc(100% - (var(--dock-top) - var(--top-bar-height) - var(--start-sheet-padding)));
        width: auto;
        display: grid;
        grid-template-columns: 1fr;
        align-content: start;
        gap: 8px;
        padding: var(--start-sheet-padding) var(--start-margin);
        border-left: none;
        border-top: 1px solid var(--line-color);
      }
      /* slides down out of the window, instead of out to the right */
      body.is-narrow:not(.is-starting) .start-modes {
        translate: 0 100%;
      }
      /* the switches next to each other, across the top of the panel */
      body.is-narrow .start-switches {
        grid-column: 1 / -1;
        flex-direction: row;
        justify-content: flex-end;
        gap: 20px;
        margin: 0 0 4px;
      }
      /* THE MODE CAROUSEL (see src/lib/start.js). On a wide window it steps
         aside, as if it weren't there, and the cards stack as before. On a
         narrow one it scrolls up and down: one card fully in view in the
         middle, with --carousel-peek of the card above and below it,
         fading out towards the edges. Each scroll comes to rest with a
         card exactly in the middle (scroll-snap), one card at a time. The
         room above and below the cards lets the first and last card reach
         the middle too. */
      .start-mode-carousel {
        display: contents;
      }
      body.is-narrow .start-mode-carousel {
        --carousel-card-height: 76px;
        --carousel-peek: 28px;
        --carousel-gap: 8px;
        /* room for the focus ring at the sides, which the scrolling would
           otherwise cut off; the negative margin keeps the cards in line */
        --carousel-focus-room: 3px;
        /* the cards measure their place from here (see middleCard()) */
        position: relative;
        display: flex;
        flex-direction: column;
        gap: var(--carousel-gap);
        height: calc(var(--carousel-card-height) + 2 * (var(--carousel-peek) + var(--carousel-gap)));
        padding: calc(var(--carousel-peek) + var(--carousel-gap)) var(--carousel-focus-room);
        margin: 0 calc(-1 * var(--carousel-focus-room));
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        /* a swipe that reaches the end doesn't move the page behind */
        overscroll-behavior: contain;
        scrollbar-width: none;
        /* the slices of the cards above and below fade out, so the one in
           the middle stands out */
        mask-image: linear-gradient(
          to bottom,
          rgb(0 0 0 / 0.2),
          rgb(0 0 0) var(--carousel-peek),
          rgb(0 0 0) calc(100% - var(--carousel-peek)),
          rgb(0 0 0 / 0.2)
        );
      }
      body.is-narrow .start-mode-carousel::-webkit-scrollbar {
        display: none;
      }
      /* the modes look like on a wide window (the label above the name, the
         arrow on the right), only all as tall as each other, with less room
         above and below and a smaller name */
      body.is-narrow .start-mode {
        flex: none;
        height: var(--carousel-card-height);
        align-content: center;
        row-gap: 6px;
        padding: 0 20px;
        scroll-snap-align: center;
        /* a fast swipe still stops at the next card, instead of flying past */
        scroll-snap-stop: always;
      }
      body.is-narrow .start-mode-name {
        font-size: 24px;
      }

      /* NARROW WINDOWS: a phone, or a tablet held upright (src/lib/panels.js
         decides and sets is-narrow). The panels lie over the drawing there,
         so a soft shadow sets them apart from it. */
      body.is-narrow .library {
        box-shadow: 8px 0 24px rgb(0 0 0 / 0.08);
      }
      body.is-narrow .lil-gui.lil-root {
        box-shadow: -8px 0 24px rgb(0 0 0 / 0.08);
      }
      /* The + marks beyond the grid's corners would fall off the window
         when the grid fills its width. A drag on the canvas moves an anchor,
         instead of scrolling or zooming the page. */
      body.is-narrow .stage-mark {
        display: none;
      }
      body.is-narrow canvas {
        touch-action: none;
      }

      /* THE DOCK below the grid on narrow windows (see createDock() in
         src/sketch.js): the loop bar, then six buttons in a grid of three
         across and two down. It is as wide as the grid on screen and sits
         in the middle; src/sketch.js sets how far down (fitView()). On
         wide windows it isn't there: the panels have the same buttons. */
      .dock {
        display: none;
      }
      body.is-narrow .dock {
        position: fixed;
        left: 50%;
        /* above the drawing, below the panels, which lie over it */
        z-index: 999;
        width: var(--shown-grid-size);
        display: flex;
        flex-direction: column;
        gap: 16px;
        transform: translateX(-50%);
      }
      /* the loop bar takes the whole width, centred under the grid */
      .dock .panel-progress {
        flex: none;
        margin: 0;
      }
      .dock-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .dock-buttons .ui-button {
        height: var(--large-button-height);
        padding: 0 8px;
        border-radius: var(--large-radius);
      }

      /* On a phone the title in the middle is left out, and the subtitle
         only shows on the start screen: the title bar has little room. And
         the panels need less room around their contents. */
      @media (max-width: 640px) {
        :root {
          --panel-padding: 16px;
        }
        .top-bar-title {
          display: none;
        }
        /* The name keeps the room it needs on the left, the subtitle and
           its button take the rest on the right. With a little less room
           next to the buttons, the whole subtitle fits on most phones; on
           a very narrow one it ends in "…" instead of breaking onto a
           second line. */
        .top-bar {
          --panel-button-gap: 10px;
          grid-template-columns: auto minmax(0, 1fr);
          column-gap: 8px;
        }
        .top-bar-end {
          grid-column: 2;
          min-width: 0;
        }
        .top-bar-subtitle {
          min-width: 0;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
        }
        /* The subtitle only shows on the start screen. It fades out with
           the start screen once a mode is picked, and back in with it.
           The transform is the move it already makes (see "on the start
           screen the buttons are hidden"); `transition` replaces the
           whole list, so both are listed here. */
        .top-bar-end .top-bar-subtitle {
          transition:
            transform var(--fade-duration) ease-in-out var(--start-screen-delay),
            opacity var(--fade-duration) ease var(--start-screen-delay);
        }
        body:not(.is-starting) .top-bar-subtitle {
          opacity: 0;
        }
        /* only the subtitle gives way, never the button next to it */
        .top-bar-end .top-bar-panel-button {
          flex-shrink: 0;
        }
      }

      /* the flash when saving: the accent color over the whole window,
         below the two panels. It is invisible until src/lib/library.js
         fades it in and out. */
      .library-flash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: var(--accent-color);
        opacity: 0;
        pointer-events: none;
      }

      /* THE LARGE PREVIEW of a saved variation: a light card over the
         blurred window. The room around the card, inside it and inside the
         frame is smaller on a phone (see "on a phone" below). If the card
         is taller than the window, the preview scrolls. */
      .library-preview {
        --preview-window-padding: 24px;
        --preview-card-padding: 24px;
        --preview-frame-padding: 16px;
        /* how much of the window's width and height is not the picture:
           the paddings and lines on both sides, and across, the name, the
           buttons and the gaps between them */
        --preview-room-across: 160px;
        --preview-room-down: 354px;
        /* the picture never gets smaller than this; on a very short window
           the preview scrolls instead */
        --preview-smallest-picture: 160px;
        /* Opening: the blurred veil fades in, and the card rises this far
           and grows from this size into place. Closing goes back the same
           way. Once faded out, the preview is invisible, so clicks and the
           Tab key go past it. */
        --preview-fade-duration: 300ms;
        --preview-rise: 16px;
        --preview-start-scale: 0.97;
        position: fixed;
        inset: 0;
        z-index: 1002;
        display: flex;
        overflow-y: auto;
        padding: var(--preview-window-padding);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--preview-fade-duration) ease,
          visibility 0s linear var(--preview-fade-duration);
        background: var(--backdrop-color);
        backdrop-filter: blur(6px);
        color: var(--ink-color);
        font-family: var(--text-font);
        font-size: 14px;
      }
      .library-preview-content {
        display: flex;
        flex-direction: column;
        gap: 20px;
        /* in the middle of the window; when it is taller than the window,
           it starts at the top, so nothing is cut off above */
        margin: auto;
        padding: var(--preview-card-padding);
        transform: translateY(var(--preview-rise)) scale(var(--preview-start-scale));
        transition: transform var(--preview-fade-duration) var(--fold-easing);
        background: var(--page-color);
        border: 1px solid var(--line-color);
        border-radius: 18px;
        box-shadow: 0 24px 64px rgb(0 0 0 / 0.14);
      }
      /* open: visible straight away, then faded in, the card in place */
      .library-preview.is-open {
        opacity: 1;
        visibility: visible;
        transition:
          opacity var(--preview-fade-duration) ease,
          visibility 0s;
      }
      .library-preview.is-open .library-preview-content {
        transform: none;
      }
      /* the name, and Close on the right */
      .library-preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .library-preview-name {
        font-family: var(--heading-font);
        font-size: 26px;
        letter-spacing: calc(-0.3px + var(--text-tracking));
      }
      .library-preview-header .ui-button {
        width: var(--large-button-height);
        height: var(--large-button-height);
        padding: 0;
        border: 1px solid var(--line-color);
        border-radius: var(--large-radius);
        background: none;
      }
      .library-preview-header .ui-button:hover {
        background: var(--button-color);
      }
      /* a thin frame around the picture, with a label in each top corner */
      .library-preview-frame {
        padding: 12px var(--preview-frame-padding) var(--preview-frame-padding);
        border: 1px solid var(--line-color);
        border-radius: 12px;
      }
      .library-preview-labels {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        color: var(--muted-color);
      }
      /* the picture and the guide layers on top of it */
      .library-preview-stage {
        position: relative;
      }
      /* as large as fits in the window, leaving room for the name and the
         settings above and the export buttons below */
      .library-preview-image {
        display: block;
        width: min(calc(100vw - var(--preview-room-across)), calc(100vh - var(--preview-room-down)));
        min-width: var(--preview-smallest-picture);
        aspect-ratio: 1;
        object-fit: contain;
        border-radius: var(--radius);
      }
      /* with Background off, a checkerboard behind the picture shows
         where it is see-through */
      .library-preview-stage.is-see-through .library-preview-image {
        background: repeating-conic-gradient(var(--button-color) 0% 25%, var(--card-color) 0% 50%) 0 0 / 16px 16px;
      }
      /* the grid and the anchors, exactly over the picture. Clicks go
         through them. */
      .library-preview-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      /* the two rows of buttons, both starting on the left: under the name,
         Grid, Anchors and Background; below the frame, the PNG resolution,
         then PNG, SVG and MP4 */
      .library-preview-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        /* never wider than the picture: otherwise the frame would stretch
           and the guides would no longer sit on the drawing. Buttons that
           don't fit move to a second row. */
        width: 0;
        min-width: 100%;
      }
      /* a group's buttons move onto another line when they don't fit next
         to each other, so they never reach past the picture */
      .library-preview-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .library-preview-bar .ui-button {
        height: var(--large-button-height);
        padding: 0 var(--preview-button-padding, 20px);
        gap: 10px;
      }
      /* the PNG resolution field: a grey button that opens a short list.
         The small arrow on the right says it opens. Written with
         .library-preview-bar in front, so the grey buttons' own padding
         and hover color don't wipe out the arrow. */
      .library-preview-bar .library-preview-resolution {
        appearance: none;
        padding-right: 36px;
        background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position: right 20px center, right 16px center;
        background-size: 4px 4px;
        background-repeat: no-repeat;
        color: var(--ink-color);
        font: inherit;
        cursor: pointer;
      }
      /* a guide or the background that is showing: its button tinted in
         the accent color */
      .library-preview-bar .ui-button.is-on {
        background: color-mix(in srgb, var(--accent-color) 22%, var(--card-color));
      }
      .library-preview-bar .ui-button.is-on:hover {
        background: color-mix(in srgb, var(--accent-color) 32%, var(--card-color));
      }
      /* on a phone: less room around the card, inside it and inside the
         frame, and narrower buttons, so the picture gets more of the width.
         The buttons take two lines each, so more of the height is not the
         picture. */
      @media (max-width: 640px) {
        .library-preview {
          --preview-window-padding: 12px;
          --preview-card-padding: 16px;
          --preview-frame-padding: 12px;
          --preview-button-padding: 14px;
          --preview-room-across: 88px;
          --preview-room-down: 460px;
        }
        .library-preview-name {
          font-size: 22px;
        }
      }

      /* THE CHANGE BETWEEN LIGHT AND DARK (the Invert switch): the whole
         page, the drawing included, fades from the old colors into the
         new ones. src/sketch.js asks the browser for this (a "view
         transition", see invertColorsSmoothly()); these set how long the
         fade takes and how it eases. Browsers without view transitions
         change the colors at once. */
      :root {
        --theme-fade-duration: 500ms;
      }
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: var(--theme-fade-duration);
        animation-timing-function: ease-in-out;
      }

      /* Someone who asked their computer for less motion gets the popup
         and the colors without the fades. */
      @media (prefers-reduced-motion: reduce) {
        .library-preview,
        .library-preview-content {
          transition: none;
        }
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation: none;
        }
      }
    </style>
  </head>
  <!-- is-starting: the page opens on the start screen, see src/lib/start.js -->
  <body class="is-starting">
    <script type="module" src="/src/sketch.js"></script>
  </body>
</html>
