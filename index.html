<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANCYPH</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }

      /* How wide the library (left) and the control panel (right) are. They
         share the room the grid leaves in the window, minus a gap on each
         side of the grid, so they grow and shrink with the window. They never
         get narrower than the smallest width or wider than the largest.
         --grid-size is set by src/sketch.js from gridSize in src/config.js. */
      :root {
        --panel-gap: 24px;
        --panel-min-width: 220px;
        --panel-max-width: 400px;
        --panel-width: clamp(
          var(--panel-min-width),
          calc((100vw - var(--grid-size, 800px)) / 2 - var(--panel-gap)),
          var(--panel-max-width)
        );
        /* the room between the panels' left and right edges and what is in
           them: titles, controls, buttons and cards */
        --panel-padding: 32px;
        /* the room below the controls at the end of each folder */
        --group-padding: 16px;
        /* the room between a folder's title and its first control */
        --group-title-gap: 0px;
        /* the room between the line above a folder and its title */
        --title-line-gap: 4px;
        /* the gap between a panel's title (Controls, Library) and what
           comes first below it */
        --title-gap: 8px;
        /* the room the folder arrows (▾ ▸) take in front of their titles,
           including the space between arrow and text */
        --arrow-width: 24px;
        /* how tall the project title across the top of the window is. The
           library, the control panel and the title above the grid start
           below it. */
        --project-title-height: 72px;
      }
      /* the g key hides the project title with the panels: then nothing
         needs to make room for it */
      body.without-project-title {
        --project-title-height: 0px;
      }

      /* Every button in both panels and the preview has the same size: this
         tall, with this much room left and right of its text. The square
         icon buttons are as wide as they are tall. */
      :root {
        --button-height: 28px;
        --button-padding: 10px;
      }

      /* the control panel: the whole height of the window, flush with the
         right edge. The sketch centres the grid between it and the library. */
      .lil-gui.lil-root.lil-auto-place {
        top: var(--project-title-height);
        right: 0;
        height: calc(100% - var(--project-title-height));
        /* lil-gui reads its width from --width */
        --width: var(--panel-width);
      }

      /* The part of each panel that scrolls when it gets long: the folders
         in the control panel, the cards in the library. A scrollbar takes
         room from what is inside, which made the padding seem to change as
         soon as one appeared. "stable" keeps that room free on the right all
         the time, scrollbar or not. The left side is left alone, so what is
         inside lines up with the panel titles above. */
      .lil-gui.lil-root > .lil-children,
      .library-list {
        scrollbar-gutter: stable;
      }

      /* the size of the text in the control panel. Every folder sets its
         own sizes, so this has to apply to all of them, not only the panel. */
      .lil-gui {
        --font-size: 14px;
        --input-font-size: 14px;
        /* the height of each row, raised with the text so it still fits */
        --widget-height: 24px;
        /* lil-gui's room left and right of every title and control */
        --padding: var(--panel-padding);
      }

      /* the buttons in the control panel (Reconnect, Clear, the switches,
         the Style field…), sized like all the others. Side by side, each
         takes the room its text needs, so a long word like "Animation"
         isn't cut off. */
      .lil-gui .lil-controller button {
        height: var(--button-height);
        padding: 0 var(--button-padding);
        width: auto;
        flex: 1 1 auto;
      }

      /* the bold font for the folder titles, straight from the fonts folder */
      @font-face {
        font-family: 'SpaceGrotesk-Bold';
        src: url('/fonts/SpaceGrotesk-Bold.otf');
        font-weight: 700;
      }

      /* the titles: Controls and Library at the top of the two panels, and
         the folders (Modes, Grid, Anchors…) */
      .lil-gui > .lil-title,
      .library-title {
        font-family: 'SpaceGrotesk-Bold', sans-serif;
        font-size: 20px;
        font-weight: 700;
        /* 0.5px wider than the rest of the text */
        letter-spacing: 1px;
      }
      /* taller, so the bigger text fits */
      .lil-gui > .lil-title {
        --title-height: 36px;
      }
      /* Modes and Library, the headlines of the two panels, are a bit
         bigger than the folder titles. Both get exactly the same box: 36px
         tall, with a line as tall as the box, so the text sits at the same
         height in both. */
      .lil-gui.lil-root > .lil-title,
      .library-title {
        font-size: 22px;
        height: 36px;
        line-height: 36px;
        padding: 0 var(--panel-padding);
      }
      /* Modes is only a headline, like Library: clicking it doesn't fold
         the panel away, and it has no arrow in front */
      .lil-gui.lil-root > .lil-title {
        pointer-events: none;
      }
      .lil-gui.lil-root > .lil-title::before {
        content: none;
      }
      /* The Modes folder always stays open and has no title of its own:
         the panel's headline above it already says Modes. */
      .lil-gui.lil-always-open > .lil-title {
        display: none;
      }

      /* the Controls headline: between the modes and the folders, it looks
         like the panel's headline at the top. Randomize All and Reset All
         sit side by side below it, lined up with the controls. */
      .panel-section-title {
        /* the title on the left, icons (Playback) on the right */
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 36px;
        line-height: 36px;
        padding: 0 var(--panel-padding) 0 calc(var(--panel-padding) + var(--arrow-width));
        background: var(--title-background-color);
        color: var(--title-text-color);
        font-family: 'SpaceGrotesk-Bold', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .panel-section-actions {
        display: flex;
        gap: 4px;
        padding: var(--title-gap) var(--panel-padding) var(--title-gap) calc(var(--panel-padding) + var(--arrow-width));
      }
      .panel-section-actions button {
        flex: 1;
        height: var(--button-height);
        padding: 0 var(--button-padding);
        background: var(--widget-color);
        border-radius: var(--widget-border-radius);
      }
      .panel-section-actions button:hover {
        background: var(--hover-color);
      }
      /* Restart and Play/Pause on the right of the Playback headline:
         square, with the icon in the middle */
      .panel-section-icons {
        display: flex;
        gap: 4px;
      }
      .panel-section-icons .panel-icon-button {
        width: var(--button-height);
        height: var(--button-height);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--widget-color);
        border-radius: var(--widget-border-radius);
      }
      .panel-section-icons .panel-icon-button:hover {
        background: var(--hover-color);
      }

      /* The line between folders: lil-gui draws it on the title itself,
         right against the text. Here the title loses its lines, and the
         folder gets the line on its top edge instead. A margin above the
         title keeps some room between the line and the title (see
         --title-line-gap). */
      .lil-gui.lil-root > .lil-children > .lil-gui > .lil-title {
        border-color: transparent;
        margin-top: var(--title-line-gap);
      }
      /* The arrow (▾ or ▸) in front of a folder title hangs out to the left,
         into the padding, so the title's text starts exactly where the
         Controls title does. The arrow box is pulled back by its own width;
         the arrow sits at its left, so a wider box means more space between
         the arrow and the text. */
      .lil-gui.lil-root > .lil-children > .lil-gui > .lil-title::before {
        width: var(--arrow-width);
        margin-left: calc(-1 * var(--arrow-width));
        padding-right: 0;
      }
      /* So the arrows still keep the panel padding from the left edge, the
         control panel has the arrows' width more room on the left: the
         Controls title, the folder titles and every control move in by it,
         and all of them still line up. */
      .lil-gui.lil-root > .lil-title,
      .lil-gui.lil-root > .lil-children > .lil-gui > .lil-title,
      .lil-gui .lil-controller {
        padding-left: calc(var(--panel-padding) + var(--arrow-width));
      }
      /* every folder, open or closed: the line on top, and the group
         padding below its end */
      .lil-gui.lil-root > .lil-children > .lil-gui {
        border-top: 1px solid var(--widget-color);
        padding: 0 0 var(--group-padding);
      }
      /* the first folder (Modes) has nothing above it to separate it from,
         so its line is invisible, and instead of the room below the line it
         gets the same small gap below the Controls title as the library has
         between its title and the Save Iteration button */
      .lil-gui.lil-root > .lil-children > .lil-gui:first-child {
        border-top-color: transparent;
        padding-top: var(--title-gap);
      }
      .lil-gui.lil-root > .lil-children > .lil-gui:first-child > .lil-title {
        margin-top: 0;
      }
      /* A closed folder lights up as a whole when the mouse is over it, from
         the line down to the next folder, not only its title. A click
         anywhere in it opens it (see src/sketch.js). The title doesn't light
         up on its own then, so the whole section is one even color. */
      .lil-gui.lil-root > .lil-children > .lil-gui.lil-closed:hover {
        background: var(--title-background-color);
        cursor: pointer;
      }
      .lil-gui.lil-root > .lil-children > .lil-gui.lil-closed > .lil-title:hover {
        background: none;
        opacity: 1;
      }
      /* room between an open folder's title and its first control */
      .lil-gui.lil-root > .lil-children > .lil-gui > .lil-children {
        padding-top: var(--group-title-gap);
      }

      /* the tracking (space between letters) of every text in both panels
         and the library's preview. Buttons and text fields don't pass it on
         by themselves, so they are told to take it over. */
      .lil-gui,
      .library,
      .library-preview {
        letter-spacing: 0.5px;
      }
      .lil-gui :is(button, input, select, textarea),
      .library :is(button, input, select, textarea),
      .library-preview :is(button, input, select, textarea) {
        letter-spacing: inherit;
      }

      /* the library, on the left. Its colors and sizes match the control
         panel, and the outline of the loaded variation uses the accent color. */
      .library {
        position: fixed;
        top: var(--project-title-height);
        left: 0;
        z-index: 1001;
        width: var(--panel-width);
        height: calc(100% - var(--project-title-height));
        display: flex;
        flex-direction: column;
        background: #1f1f1f;
        color: #ebebeb;
        font-family: panel-font, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
      }
      .library[hidden] {
        display: none;
      }
      /* without this, the rows of buttons below would still show when the
         library hides them */
      .library [hidden] {
        display: none;
      }
      .library-title {
        background: #111111;
      }

      /* the title above the grid: a bar across the top of the middle, from
         the library to the control panel, styled like the Library title,
         with the text in line with the left edge of the grid */
      .stage-title {
        position: fixed;
        top: var(--project-title-height);
        left: var(--panel-width);
        right: var(--panel-width);
        z-index: 1001;
        height: 36px;
        line-height: 36px;
        /* the text starts where the grid starts: the grid sits in the middle
           of this bar, so the space on its left is half of what the grid
           leaves free */
        padding: 0 0 0 calc((100vw - 2 * var(--panel-width) - var(--grid-size)) / 2);
        background: #111111;
        color: #ebebeb;
        font-family: 'SpaceGrotesk-Bold', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .stage-title[hidden] {
        display: none;
      }

      /* the project title: the project's name across the whole window,
         above the Library, Iteration and Modes titles, and bigger than
         them. Its text is projectTitle in src/config.js. */
      .project-title {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1001;
        height: var(--project-title-height);
        line-height: var(--project-title-height);
        padding: 0 var(--panel-padding);
        background: #111111;
        color: #ebebeb;
        font-family: 'SpaceGrotesk-Bold', sans-serif;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .project-title[hidden] {
        display: none;
      }
      .library button,
      .library-preview button {
        height: var(--button-height);
        padding: 0 var(--button-padding);
      }
      /* the name field above each card */
      .library input {
        height: 20px;
      }
      .library button,
      .library input,
      .library-preview button {
        border: none;
        border-radius: 2px;
        background: #424242;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .library button:hover,
      .library-preview button:hover {
        background: #4f4f4f;
      }
      /* the buttons for selected variations, while none is selected */
      .library button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .library button:disabled:hover {
        background: #424242;
      }
      .library-save {
        margin: var(--title-gap) var(--panel-padding);
      }
      .library-selection-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 0 var(--panel-padding) 8px;
      }
      .library-selection-actions button {
        flex: 1;
      }
      .library-empty {
        padding: 0 var(--panel-padding);
        line-height: 1.4;
        /* a \n in the text starts a new line */
        white-space: pre-line;
        opacity: 0.6;
        /* right below the buttons, with the same small gap as between the
           buttons and the library's title */
        margin-top: var(--title-gap);
      }
      /* the empty list takes no room while the message shows */
      .library-list:empty {
        display: none;
      }
      .library-list {
        flex: 1;
        overflow-y: auto;
        list-style: none;
        padding: 0 var(--panel-padding) 8px;
      }
      .library-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }
      /* the picture, with the checkbox and the selection layer on top */
      .library-thumbnail {
        position: relative;
      }
      .library-thumbnail img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        /* a slanted grid makes a wider picture; it is shown whole */
        object-fit: contain;
        outline: 1px solid #424242;
        cursor: zoom-in;
      }
      .library-item.is-active img {
        outline: 2px solid var(--accent-color, #39ff14);
      }
      .library-selection-mask {
        position: absolute;
        inset: 0;
        background: var(--accent-color, #39ff14);
        opacity: 0;
        /* clicks go through to the picture below */
        pointer-events: none;
      }
      .library-item.is-selected .library-selection-mask {
        opacity: 0.25;
      }
      .library-item .library-selection-checkbox {
        position: absolute;
        top: 6px;
        left: 6px;
        width: 14px;
        height: 14px;
        padding: 0;
        cursor: pointer;
        accent-color: var(--accent-color, #39ff14);
      }
      .library-item input {
        padding: 0 4px;
        background: transparent;
        cursor: text;
      }
      .library-item input:focus {
        background: #424242;
        outline: none;
      }
      /* Delete (x) and Load (arrow) on the picture's right corners, dark
         enough to stand out on any drawing */
      .library .library-icon-button {
        position: absolute;
        right: 6px;
        width: var(--button-height);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(31, 31, 31, 0.8);
      }
      .library .library-icon-button:hover {
        background: #4f4f4f;
      }
      .library-delete {
        top: 6px;
      }
      .library-load {
        bottom: 6px;
      }

      /* the flash when saving: the accent color over the whole window, below
         the two panels. It is invisible until src/lib/library.js fades it in
         and out. White until the sketch has set the accent color. */
      .library-flash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: var(--accent-color, #ffffff);
        opacity: 0;
        pointer-events: none;
      }

      /* the large preview of a saved variation, over the whole window */
      .library-preview {
        position: fixed;
        inset: 0;
        z-index: 1002;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.8);
        color: #ebebeb;
        font-family: panel-font, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
      }
      .library-preview[hidden] {
        display: none;
      }
      .library-preview-content {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        background: #1f1f1f;
      }
      .library-preview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      /* Close: a square x, like Delete on the cards */
      .library-preview-header .library-icon-button {
        width: var(--button-height);
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* the picture and the guide layers on top of it */
      .library-preview-stage {
        position: relative;
      }
      /* the grid and the anchors, exactly over the picture. Clicks go
         through them. */
      .library-preview-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }
      .library-preview-layer[hidden] {
        display: none;
      }
      /* Grid, Anchors, PNG and SVG on the picture's bottom right corner, as
         far in from the edges as the icons on the cards, and dark enough to
         stand out on any drawing. All four have the same padding. */
      .library-preview-footer {
        position: absolute;
        right: 6px;
        bottom: 6px;
        display: flex;
        gap: 4px;
      }
      .library-preview-footer button {
        padding: 0 var(--button-padding);
        background: rgba(31, 31, 31, 0.8);
      }
      /* a guide that is showing: its button lit up in the accent color */
      .library-preview-footer button.is-on {
        background: var(--accent-color, #39ff14);
        color: #1f1f1f;
      }
      /* as large as fits in the window, leaving room for the name above */
      .library-preview-image {
        display: block;
        width: min(calc(100vw - 64px), calc(100vh - 100px));
        aspect-ratio: 1;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/sketch.js"></script>
  </body>
</html>
